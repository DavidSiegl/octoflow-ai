# The gate's settings for judging this repository: what its defaults do not already say (octoflow-gate's
# docs/quality-gate.md, "The gate's settings", lists every key). A quality build judges a snapshot by main's copy of
# this file, beside main's pyproject.toml; any other build by its own (the Jenkinsfile's Gate stage). The release
# ci/gate.pin names must read it: it refuses a key it does not know.
#
# Its tests are where the defaults look: Rust's under engine/tests/, in tests.rs files and in #[cfg(test)] modules,
# its golden files under tests/golden/. No Python file is tracked, so the gate runs neither ruff nor mypy, and has no
# Python to measure the coverage of or mutation-test; the Python left is the gate's own toolchain (pyproject.toml).

[build-config]
Jenkinsfile = "The quality job reads it from `main`, so this analysis ran without the edit."
"ci/gate.pin" = "A quality build takes the gate release from `main`'s pin, so this analysis ran without the edit."
"ci/fetch-gate.sh" = "A quality build fetches the gate with `main`'s copy, so this analysis ran without the edit."

# The command a gate run outside Jenkins, such as octoflow's `--quality-gate local`, runs the tests with: the one the
# Jenkinsfile's Test stage runs, there with the e2e scenarios' filter, whose reports its Gate stage passes with --tests
# and --coverage in place of this.
[[test]]
name = "cargo-nextest"
command = ["sh", "ci/rust-tests.sh"]
junit = ["target/nextest/ci/junit.xml"]
coverage = ["coverage-rust.xml"]

# The defaults, written out: a quality round's timeout is sized for them.
[budgets]
mutation = 600
base-run = 120
