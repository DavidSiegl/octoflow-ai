# The Rust toolchain every cargo step of the workspace runs on: the one the Jenkins agent's image provides, whose
# rustup home a build cannot add to (the Jenkinsfile's Install stage checks for the components). clippy is the quality
# gate's Rust linter, llvm-tools has the llvm-profdata and llvm-cov that cargo-llvm-cov reads the Test stage's
# coverage with, and rustfmt is the formatter ci/rustfmt.sh holds the code to. A rustup without this toolchain installs
# it on the first cargo command, components included.
[toolchain]
channel = "1.99.1"
components = ["clippy", "llvm-tools", "rustfmt"]
profile = "minimal"
