# The repository's one Cargo workspace: the Rust engine (engine/, the rust-engine spec's Lane), its e2e scenarios
# (engine/e2e/), the desktop app's Tauri shell (ui/src-tauri/) and the repository's chores (xtask/), with one
# Cargo.lock, one toolchain (rust-toolchain.toml) and one set of lints. Jenkins's Test stage runs every member's tests
# here, and the quality gate's clippy lints the workspace as a whole.
[workspace]
members = ["engine", "engine/e2e", "ui/src-tauri", "xtask"]
resolver = "2"

# clippy's rules for every member, by which the quality gate judges a change to its Rust (docs/quality-gate.md):
# clippy's defaults, and these, which main passed when they were set. Each at warn, since the gate caps every level at
# warn anyway; and rustc's unsafe_code at deny would stop cargo test at the first crate that has unsafe code. A member
# takes them with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
# A suppression says why it stands: `#[allow(lint, reason = "...")]`.
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
