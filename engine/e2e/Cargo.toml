[package]
name = "octoflow-e2e"
version = "0.1.0"
description = "The engine's end-to-end scenarios: the orchestrator program run against fakes of herdr, gh, ssh, octoflow-gate, Jenkins and PyPI"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The engine's ordered Map and its JSON helpers (octoflow_engine::json).
octoflow-engine = { path = ".." }
# JSON for the fakes' ledger, the script and the recordings: preserve_order keeps an object's keys in their order,
# which a recording is compared in (tests/e2e/compare.rs).
serde_json = { version = "1", features = ["preserve_order"] }
# The ledger's lock (flock), the world's kill of an invocation (signals) and the host's name, which the normalizer
# writes as <host>: the engine's own dependency, with the fs feature for flock.
nix = { version = "0.31", default-features = false, features = ["fs", "hostname", "signal"] }
# A scenario's directory under a name no other test run has (Scratch::new): the workspace's tempfile, as the engine's
# tests use it. Decided for ticket 49, 2026-11-13.
tempfile = "3"

[dev-dependencies]
# Writing a recording through serde_json's pretty printer with an indent of its own (tests/e2e/main.rs).
serde = "1"
# The world's fake Jenkins (tests/e2e/servers.rs): the engine's own HTTP server, as its http.rs and ci.rs tests use it.
tiny_http = "0.12"
# The world's fake PyPI, which the engine reaches over TLS through the world's HTTPS proxy: rustls and its key and
# certificate types, the versions Cargo.lock had through ureq, with ureq's ring provider. Approved by the user for
# octoflow-without-python ticket 02, 2026-10-31.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1.15.1", features = ["std"] }
# The docs check (tests/docs/) reads the names the engine's Rust defines by parsing it: syn 2, the version Cargo.lock
# had through tauri-build, with full for items and visit to walk them. Decided with the user for
# octoflow-without-python ticket 07, 2026-11-03.
syn = { version = "2.0.119", features = ["full", "visit"] }

# The programs a world puts on the engine's PATH as herdr, gh, ssh and octoflow-gate (src/fakes.rs). They are
# binaries of this package so that its tests find them by CARGO_BIN_EXE_*, which Cargo sets only for a test's own
# package.
[[bin]]
name = "fake-herdr"
path = "src/bin/fake-herdr.rs"

[[bin]]
name = "fake-gh"
path = "src/bin/fake-gh.rs"

[[bin]]
name = "fake-ssh"
path = "src/bin/fake-ssh.rs"

[[bin]]
name = "fake-gate"
path = "src/bin/fake-gate.rs"

[lints]
workspace = true
