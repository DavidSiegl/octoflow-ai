# Not a Python project: octoflow has no Python of its own. This file and uv.lock hold the quality gate's toolchain,
# with .python-version: the Markdown linter the gate runs, pymarkdown, the Python it runs on, and its rules, which the
# gate, the octoflow-gate release ci/gate.pin names, reads from here beside gate.toml. The gate itself needs no Python.
# The release version is engine/Cargo.toml's (ci/release-version.sh).

[dependency-groups]
dev = [
    "pymarkdownlnt>=0.9.41",
]

# The rules the quality gate judges a change by. In a quality build the gate reads them from main's copy of this file
# (--config), so a change cannot loosen the rules it is judged by. Only findings on lines a change adds count, so the
# findings already on main do not block.

[tool.pymarkdown]
# The docs wrap at 120, by eye. README.md opens with its logo in HTML, which also keeps a heading off its first line.
plugins.md013.enabled = false
plugins.md033.enabled = false
plugins.md041.enabled = false
